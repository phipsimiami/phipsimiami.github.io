<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Form</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body class="p-4">
  <div class="container">
    <h2>Contact Us</h2>
    <form id="contact-form">
      <div class="mb-3">
        <label for="name" class="form-label">Your Name</label>
        <input type="text" id="name" class="form-control" required />
      </div>
      <div class="mb-3">
        <label for="message" class="form-label">Message</label>
        <textarea id="message" class="form-control" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary">Send</button>
    </form>
    <div id="status" class="mt-3"></div>
  </div>

  <script>
    document.getElementById('contact-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const message = document.getElementById('message').value;

      const response = await fetch("https://api.github.com/repos/YOUR_USER/YOUR_REPO/dispatches", {
        method: "POST",
        headers: {
          "Authorization": "Bearer YOUR_PUBLIC_WORKFLOW_TOKEN",
          "Accept": "application/vnd.github.v3+json"
        },
        body: JSON.stringify({
          event_type: "form_submission",
          client_payload: { name, message }
        })
      });

      document.getElementById('status').textContent = response.ok ? "Sent!" : "Error sending message.";
    });
  </script>
</body>
</html>
